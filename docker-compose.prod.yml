services:
  app:
    build:
      context: /opt/dapi-app/src
      dockerfile: Dockerfile
    image: dhpi-app:latest
    container_name: dhpi_app
    restart: always
    ports:
      - "80:80"
    environment:
      APP_NAME: "DHPI App"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://172.28.21.161
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dhpi_app}
      DB_USERNAME: ${DB_USERNAME:-dhpi_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dhpi_net
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

  mysql:
    image: mysql:8.0
    container_name: dhpi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-dhpi_app}
      MYSQL_USER: ${DB_USERNAME:-dhpi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dhpi_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7-alpine
    container_name: dhpi_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - dhpi_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
      timeout: 5s

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: dhpi_meilisearch
    restart: always
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}
    volumes:
      - meilisearch_data:/data.ms
    networks:
      - dhpi_net

networks:
  dhpi_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
  app_storage:
  app_logs:
